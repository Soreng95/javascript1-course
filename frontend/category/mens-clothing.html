<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mens Clothing | Rainy Days</title>
    <meta
      name="description"
      content="Waterproof jackets for men from Rainy Days. Built for mountains, city streets and everyday adventures."
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav-mobile" aria-label="Mobile navigation">
        <input class="nav-mobile__toggle" type="checkbox" id="nav-toggle" />

        <div class="container nav-mobile__top">
          <label
            class="nav-mobile__btn"
            for="nav-toggle"
            aria-label="Toggle menu"
          >
            <span class="nav-mobile__bar"></span>
            <span class="nav-mobile__bar"></span>
            <span class="nav-mobile__bar"></span>
          </label>

          <a
            href="../index.html"
            class="nav-mobile__logo-link"
            aria-label="Rainy Days home"
          >
            <img
              class="nav-mobile__logo"
              src="../assets/images/logo/RainyDays_Logo_SecondaryColor.png"
              alt="Rainy Days logo"
            />
          </a>
        </div>

        <div class="nav-mobile__overlay">
          <div class="nav-mobile__panel" role="dialog" aria-label="Menu">
            <div class="nav-mobile__panel-inner">
              <div class="nav-mobile__links">
                <a
                  class="nav-mobile__link nav-mobile__link--active"
                  href="../index.html"
                  >Home</a
                >
                <a class="nav-mobile__link" href="../products/index.html">Shop All</a>
                <a class="nav-mobile__link" href="../category/mens-clothing.html">Men</a>
                <a class="nav-mobile__link" href="../category/womens-clothing.html">Women</a>
                <a class="nav-mobile__link" href="../products/index.html">New Arrivals</a>
                <a class="nav-mobile__link" href="../coming-soon/index.html"
                  >About Us</a
                >
                <a class="nav-mobile__link" href="../coming-soon/index.html"
                  >Contact</a
                >
                <a class="nav-mobile__link" href="../products/index.html"
                  >Search</a
                >
                <a data-cart-link class="nav-mobile__link" href="../cart-page/index.html"
                  >Cart</a
                >
              </div>
            </div>
          </div>

          <label
            class="nav-mobile__backdrop"
            for="nav-toggle"
            aria-label="Close menu"
          ></label>
        </div>
      </nav>

      <nav class="nav-desktop" aria-label="Desktop navigation">
        <div class="container nav-desktop__inner">
          <div
            class="nav-desktop__group nav-desktop__group--left"
            aria-label="Primary categories"
          >
            <a class="nav-link" href="../products/index.html">Shop All</a>
            <a class="nav-link" href="../category/mens-clothing.html">Men</a>
            <a class="nav-link" href="../category/womens-clothing.html">Women</a>
          </div>

          <a
            href="../index.html"
            class="nav-desktop__logo-link"
            aria-label="Rainy Days home"
          >
            <img
              class="nav-desktop__logo-image"
              src="../assets/images/logo/RainyDays_Logo_SecondaryColor.png"
              alt="Rainy Days logo"
            />
          </a>

          <div class="nav-desktop__group nav-desktop__group--right">
            <div class="nav-desktop__links" aria-label="Company links">
              <a class="nav-link" href="../products/index.html">New Arrivals</a>
              <a class="nav-link" href="../coming-soon/index.html">About Us</a>
              <a class="nav-link" href="../coming-soon/index.html">Contact</a>
            </div>

            <div class="nav-desktop__icons" aria-label="Actions">
              <a
                class="icon-btn"
                href="../products/index.html"
                aria-label="Search"
                >Search</a
              >
              <a data-cart-link
                class="icon-btn"
                href="../cart-page/index.html"
                aria-label="Cart"
                >Cart</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="products-toolbar">
        <div class="container">
          <div class="products-toolbar__top">
            <h1 class="products-toolbar__title">MENS CLOTHING</h1>

            <div class="products-toolbar__sort">
            <label class="products-toolbar__field">
              <span class="products-toolbar__field-label">Sort By</span>
              <select class="products-toolbar__select" data-sort>
                <option value="title-asc">Name A&ndash;Z</option>
                <option value="title-desc">Name Z&ndash;A</option>
                <option value="discountedPrice-asc">Price: low to high</option>
                <option value="discountedPrice-desc">Price: high to low</option>
              </select>
            </label>
          </div>
          </div>

          <div class="products-toolbar__filters" data-filters>

            <label class="products-toolbar__field">
              <span class="products-toolbar__field-label">Colour</span>
              <select class="products-toolbar__select" data-filter="baseColor">
                <option value="">All</option>
              </select>
            </label>

            <label class="products-toolbar__field">
              <span class="products-toolbar__field-label">Product</span>
              <select class="products-toolbar__select" data-filter="tag">
                <option value="">All</option>
              </select>
            </label>

            <label class="products-toolbar__field">
              <span class="products-toolbar__field-label">Search</span>
              <input
                class="products-toolbar__input"
                type="search"
                data-filter="search"
                placeholder="Jacket, hood, shell…"
              />
            </label>
          </div>
        </div>
      </section>

      <section class="product-gallery product-gallery--products">
        <div class="container">
          <div class="product-gallery__grid" data-product-grid data-gender="Male">
          </div>
        </div>
      </section>
      <section class="product-banner">
        <div class="product-banner__overlay">
          <div class="product-banner__content">
            <img
              src="../assets/images/logo/RainyDays_Logo_White.png"
              alt="Rainy Days logo"
              class="product-banner__logo"
            />
            <h2 class="product-banner__title">Prepared for the unexpected</h2>
          </div>
        </div>
      </section>

      <section class="product-gallery product-gallery--featured">
        <div class="container">
          <div class="product-gallery__grid" data-favorites-grid>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer__inner">
        <nav class="footer__links footer__links--top">
          <a href="../coming-soon/index.html">About Us</a>
          <a href="../coming-soon/index.html">Contact</a>
          <a href="../coming-soon/index.html">FAQ</a>
        </nav>

        <div class="footer__brand">
          <img
            src="../assets/images/logo/RainyDays_Logo_SecondaryColor.png"
            alt="Rainy Days logo"
            class="footer__logo"
          />
          <p class="footer__tagline">
            For the Rainy days and<br />
            every other
          </p>
        </div>

        <nav class="footer__links footer__links--bottom">
          <a href="../terms/index.html">T&amp;C</a>
            <a href="../privacy/index.html">Privacy</a>
          <a href="../coming-soon/index.html">Shipping</a>
          <a href="../coming-soon/index.html">Our Quality</a>
        </nav>
      </div>
    </footer>
    <script type="module" src="../js/pages/products.js"></script>
  </body>
</html>
