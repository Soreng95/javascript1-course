<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | Rainy Days</title>
    <meta
      name="description"
      content="Explore durable rain jackets for men and women at Rainy Days. Our products are designed for all weather conditions. Also this is a unique description."
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <!-- ToDo: Update names, prices, and match images -->
  <body>
    <header class="site-header">
      <nav class="nav-mobile" aria-label="Mobile navigation">
        <input class="nav-mobile__toggle" type="checkbox" id="nav-toggle" />

        <div class="container nav-mobile__top">
          <label
            class="nav-mobile__btn"
            for="nav-toggle"
            aria-label="Toggle menu"
          >
            <span class="nav-mobile__bar"></span>
            <span class="nav-mobile__bar"></span>
            <span class="nav-mobile__bar"></span>
          </label>

          <a
            href="../index.html"
            class="nav-mobile__logo-link"
            aria-label="Rainy Days home"
          >
            <img
              class="nav-mobile__logo"
              src="../assets/images/logo/RainyDays_Logo_SecondaryColor.png"
              alt="Rainy Days logo"
            />
          </a>
        </div>

        <div class="nav-mobile__overlay">
          <div class="nav-mobile__panel" role="dialog" aria-label="Menu">
            <div class="nav-mobile__panel-inner">
              <div class="nav-mobile__links">
                <a
                  class="nav-mobile__link nav-mobile__link--active"
                  href="../index.html"
                  >Home</a
                >
                <a class="nav-mobile__link" href="../index.html">Shop All</a>
                <a class="nav-mobile__link" href="index.html">Men</a>
                <a class="nav-mobile__link" href="index.html">Women</a>
                <a class="nav-mobile__link" href="index.html">New Arrivals</a>
                <a class="nav-mobile__link" href="../coming-soon/index.html"
                  >About Us</a
                >
                <a class="nav-mobile__link" href="../coming-soon/index.html"
                  >Contact</a
                >
                <a class="nav-mobile__link" href="../coming-soon/index.html"
                  >Search</a
                >
                <a data-cart-link class="nav-mobile__link" href="../cart-page/index.html"
                  >Cart</a
                >
              </div>
            </div>
          </div>

          <label
            class="nav-mobile__backdrop"
            for="nav-toggle"
            aria-label="Close menu"
          ></label>
        </div>
      </nav>

      <nav class="nav-desktop" aria-label="Desktop navigation">
        <div class="container nav-desktop__inner">
          <div
            class="nav-desktop__group nav-desktop__group--left"
            aria-label="Primary categories"
          >
            <a class="nav-link" href="../products/index.html">Shop All</a>
            <a class="nav-link" href="../products/index.html">Men</a>
            <a class="nav-link" href="../products/index.html">Women</a>
          </div>

          <a
            href="../index.html"
            class="nav-desktop__logo-link"
            aria-label="Rainy Days home"
          >
            <img
              class="nav-desktop__logo-image"
              src="../assets/images/logo/RainyDays_Logo_SecondaryColor.png"
              alt="Rainy Days logo"
            />
          </a>

          <div class="nav-desktop__group nav-desktop__group--right">
            <div class="nav-desktop__links" aria-label="Company links">
              <a class="nav-link" href="../products/index.html">New Arrivals</a>
              <a class="nav-link" href="../coming-soon/index.html">About Us</a>
              <a class="nav-link" href="../coming-soon/index.html">Contact</a>
            </div>

            <div class="nav-desktop__icons" aria-label="Actions">
              <a
                class="icon-btn"
                href="../coming-soon/index.html"
                aria-label="Search"
                >Search</a
              >
              <a data-cart-link
                class="icon-btn"
                href="../cart-page/index.html"
                aria-label="Cart"
                >Cart</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="products-toolbar">
        <div class="container">
          <div class="products-toolbar__top">
            <h1 class="products-toolbar__title">SHOP ALL</h1>

            <div class="products-toolbar__sort">
              <a href="#" class="products-toolbar__link">
                Sort By
                <span class="products-toolbar__chevron" aria-hidden="true"
                  >⌄</span
                >
              </a>
            </div>
          </div>

          <div class="products-toolbar__filters" data-filters>
            <a href="#" class="products-toolbar__link">
              Season
              <span class="products-toolbar__chevron" aria-hidden="true"
                >⌄</span
              >
            </a>

            <a href="#" class="products-toolbar__link">
              Colour
              <span class="products-toolbar__chevron" aria-hidden="true"
                >⌄</span
              >
            </a>

            <a href="#" class="products-toolbar__link">
              Product
              <span class="products-toolbar__chevron" aria-hidden="true"
                >⌄</span
              >
            </a>
          </div>
        </div>
      </section>

      <section class="product-gallery product-gallery--products">
        <div class="container">
          <div class="product-gallery__grid" data-product-grid>
          </div>
        </div>
      </section>
      <section class="product-banner">
        <div class="product-banner__overlay">
          <div class="product-banner__content">
            <img
              src="../assets/images/logo/RainyDays_Logo_White.png"
              alt="Rainy Days logo"
              class="product-banner__logo"
            />
            <h2 class="product-banner__title">Prepared for the unexpected</h2>
          </div>
        </div>
      </section>

      <section class="product-gallery product-gallery--featured">
        <div class="container">
          <div class="product-gallery__grid" data-favorites-grid>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer__inner">
        <nav class="footer__links footer__links--top">
          <a href="../coming-soon/index.html">About Us</a>
          <a href="../coming-soon/index.html">Contact</a>
          <a href="../coming-soon/index.html">FAQ</a>
        </nav>

        <div class="footer__brand">
          <img
            src="../assets/images/logo/RainyDays_Logo_SecondaryColor.png"
            alt="Rainy Days logo"
            class="footer__logo"
          />
          <p class="footer__tagline">
            For the Rainy days and<br />
            every other
          </p>
        </div>

        <nav class="footer__links footer__links--bottom">
          <a href="../coming-soon/index.html">T&amp;C</a>
          <a href="../coming-soon/index.html">Shipping</a>
          <a href="../coming-soon/index.html">Our Quality</a>
        </nav>
      </div>
    </footer>
    <script type="module" src="../js/pages/products.js"></script>
  </body>
</html>
